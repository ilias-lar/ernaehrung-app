# Xcode-Projekt wird aus dieser Datei erzeugt (XcodeGen) – kein Mac zum Bearbeiten nötig.
name: Ernaehrung
options:
  bundleIdPrefix: app.ernaehrung
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: de
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  Ernaehrung:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Ernährung
        CFBundleDevelopmentRegion: de
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/Ernaehrung.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.ernaehrung.plan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ernaehrung.plan
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Ernährung
    dependencies:
      - target: ErnaehrungWidgets
  ErnaehrungWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Ernährung
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/ErnaehrungWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.ernaehrung.plan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ernaehrung.plan.widgets
schemes:
  Ernaehrung:
    build:
      targets:
        Ernaehrung: all
        ErnaehrungWidgets: all
