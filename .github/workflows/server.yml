name: Server-Tests
on:
  push:
    paths: ['server/**', 'shared/**', 'web/**', '.github/workflows/server.yml']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test server/tests/*.test.js
      - run: node --check web/app.js && node --check web/api.js
