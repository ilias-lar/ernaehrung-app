# Codemagic: baut die iPhone-App auf einem Mac in der Cloud (500 Gratis-Minuten/Monat).
# Jetzt: nur Simulator-Build zum Prüfen. Später (mit Apple-Developer-Account): TestFlight-Workflow dazu.
workflows:
  ios-check:
    name: iPhone-App prüfen (Simulator)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: "27.2"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    when:
      changeset:
        includes:
          - 'ios/**'
          - 'codemagic.yaml'
    scripts:
      - name: XcodeGen installieren & Projekt erzeugen
        script: |
          brew install xcodegen
          cd ios && xcodegen generate
      - name: Für den Simulator bauen (ohne Signatur)
        script: |
          cd ios
          set -o pipefail
          xcodebuild -project Ernaehrung.xcodeproj -scheme Ernaehrung \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || {
              echo "===== FEHLER ====="; grep -E "error:" build.log | sort -u | head -80; exit 1; }
          echo "BUILD OK"; grep -E "warning:" build.log | sort -u | head -30 || true
    artifacts:
      - ios/build.log

  ios-preview:
    name: Vorschau-Screenshots (Simulator)
    instance_type: mac_mini_m2
    max_build_duration: 40
    environment:
      xcode: "27.2"
    scripts:
      - name: Projekt erzeugen & bauen
        script: |
          brew install xcodegen
          cd ios && xcodegen generate
          set -o pipefail
          xcodebuild -project Ernaehrung.xcodeproj -scheme Ernaehrung \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build -configuration Debug CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || {
              grep -E "error:" build.log | sort -u | head -80; exit 1; }
      - name: Simulator starten & Screenshots machen
        script: |
          #!/usr/bin/env bash
          cd ios
          RUNTIME=$(xcrun simctl list runtimes | grep -E "^iOS" | tail -1 | sed -E 's/.* - (com\.apple[^ ]*).*/\1/')
          xcrun simctl list devicetypes | grep -i iphone | tail -8
          mkdir -p shots
          run_device() { # Regex Gerätetyp, Präfix, Liste "person:tab:name[:gallery]"
            TYPE=""
            for name in $(echo "$1"); do  # bevorzugte Geräte der Reihe nach (Unterstrich = Leerzeichen)
              n=$(echo "$name" | tr '_' ' ')
              TYPE=$(xcrun simctl list devicetypes | grep -F "$n (" | head -1 | sed -E 's/.*\((com\.apple[^)]*)\).*/\1/')
              [ -n "$TYPE" ] && break
            done
            if [ -z "$TYPE" ]; then echo "Kein Gerät für $1"; return 0; fi
            echo "Gerät: $TYPE / $RUNTIME"
            UDID=$(xcrun simctl create "Vorschau-$2" "$TYPE" "$RUNTIME")
            xcrun simctl boot "$UDID"
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
            xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/Ernaehrung.app
            shift 2
            for spec in "$@"; do
              IFS=: read -r P T N G <<< "$spec"
              xcrun simctl terminate "$UDID" app.ernaehrung.plan 2>/dev/null || true
              if [ "$G" = "gallery" ]; then
                xcrun simctl launch "$UDID" app.ernaehrung.plan -demo "$P" -gallery YES
              else
                xcrun simctl launch "$UDID" app.ernaehrung.plan -demo "$P" -tab "$T"
              fi
              sleep 5
              if ! xcrun simctl io "$UDID" screenshot "shots/$N.png" 2> /tmp/shot.err; then
                # Mehrere Bildschirme (iPhone Duo): jeden einzeln aufnehmen
                for d in $(grep -oE -- '--display=[0-9]+' /tmp/shot.err | cut -d= -f2); do
                  xcrun simctl io "$UDID" screenshot --display="$d" "shots/$N-display$d.png" || true
                done
              fi
            done
            xcrun simctl shutdown "$UDID" || true
          }
          run_device "iPhone_18_Pro iPhone_17_Pro iPhone_16_Pro" pro \
            ilias:0:ilias-1-heute ilias:1:ilias-2-plan ilias:2:ilias-3-einkauf ilias:3:ilias-4-fortschritt ilias:0:ilias-5-widgets:gallery \
            freundin:0:freundin-1-heute freundin:1:freundin-2-plan freundin:2:freundin-3-einkauf freundin:3:freundin-4-fortschritt freundin:0:freundin-5-widgets:gallery
          run_device "iPhone_Duo" duo \
            ilias:0:duo-1-ilias-heute ilias:1:duo-2-ilias-plan freundin:0:duo-3-freundin-heute freundin:2:duo-4-freundin-einkauf
          ls -la shots
      - name: Übersichtsbild bauen
        script: |
          cd ios
          python3 -m venv /tmp/v && /tmp/v/bin/pip install -q pillow
          /tmp/v/bin/python - <<'PY'
          from PIL import Image
          import glob
          def collage(rows, out_name, H=760):
              rows = [r for r in rows if r]
              if not rows: return
              imgs = [[Image.open(p).convert('RGB') for p in r] for r in rows]
              gap = 24
              scaled = [[im.resize((int(im.width * H / im.height), H), Image.LANCZOS) for im in r] for r in imgs]
              W = max(sum(im.width for im in r) + gap * (len(r) + 1) for r in scaled)
              out = Image.new('RGB', (W, gap + len(scaled) * (H + gap)), (40, 40, 44))
              for y, r in enumerate(scaled):
                  x = gap
                  for im in r:
                      out.paste(im, (x, gap + y * (H + gap))); x += im.width + gap
              out.save('shots/' + out_name, quality=88)
          collage([sorted(glob.glob('shots/ilias-*.png')), sorted(glob.glob('shots/freundin-*.png'))], 'uebersicht.jpg')
          import re
          duo = sorted(glob.glob('shots/duo-*.png'))
          displays = sorted(set(re.findall(r'(display\d+)', ' '.join(duo)))) or ['']
          collage([[p for p in duo if d in p] for d in displays], 'duo-uebersicht.jpg', H=900)
          for p in glob.glob('shots/*.png'):
              im = Image.open(p).convert('RGB'); im = im.resize((im.width // 2, im.height // 2), Image.LANCZOS)
              im.save(p.replace('.png', '.jpg'), quality=85)
          PY
    artifacts:
      - ios/shots/*.jpg
